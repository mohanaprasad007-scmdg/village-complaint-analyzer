<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCA Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:white;
background:
radial-gradient(circle at 15% 10%,#173d3a,transparent 35%),
radial-gradient(circle at 90% 90%,#173052,transparent 35%),#07111e
}
.box{
width:min(430px,100%);
background:#ffffff09;
border:1px solid #ffffff14;
border-radius:25px;
padding:30px;
}
h1{font-size:27px;margin-bottom:8px}
.sub{color:#8290a2;font-size:13px;line-height:1.5;margin-bottom:25px}
label{display:block;font-size:12px;font-weight:bold;margin:15px 0 7px}
input,select{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ffffff12;
background:#081521;
color:white;
font-size:14px;
outline:none
}
button{
width:100%;
padding:14px;
margin-top:20px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#19bd9a,#187de8);
color:white;
font-size:14px;
font-weight:bold;
cursor:pointer
}
.error{
display:none;
margin-top:15px;
padding:12px;
border-radius:10px;
background:#ff44440d;
border:1px solid #ff55552a;
color:#ff9d9d;
font-size:12px
}
</style>
</head>

<body>

<div class="box">

<h1>🏛️ Village Complaint Analyzer</h1>

<p class="sub">
Choose your account type and sign in.
</p>

<form id="loginForm">

<label>Login Type</label>

<select id="loginType">
<option value="OFFICER">Department Officer</option>
<option value="ADMIN">Main Admin</option>
</select>

<label>Username</label>

<input
id="username"
type="text"
placeholder="Enter username"
required
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter password"
required
>

<button type="submit" id="btn">
🔐 Sign In
</button>

</form>

<div class="error" id="error"></div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",async function(e){

e.preventDefault();

const btn=document.getElementById("btn");
const error=document.getElementById("error");

error.style.display="none";
btn.disabled=true;
btn.textContent="⏳ Signing in...";

try{

const response=await fetch("/api/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:document.getElementById("username").value.trim(),
password:document.getElementById("password").value,
requested_role:document.getElementById("loginType").value
})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error||"Login failed.");
}

window.location.href="/admin";

}catch(err){

error.textContent="⚠️ "+err.message;
error.style.display="block";

}finally{

btn.disabled=false;
btn.textContent="🔐 Sign In";

}

});

</script>

</body>
</html>
